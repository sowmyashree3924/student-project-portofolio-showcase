<text x="950" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Self-Service Coffee Kiosk — UML Component Diagram</text>
<text x="950" y="92" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Selected style: Layered Architecture | Solid connectors = service communication</text>
<rect x="55" y="125" width="1790" height="220" rx="22" fill="#eaf2ff" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="160" font-family="Arial" font-size="18" font-weight="700" fill="#475569">PRESENTATION LAYER</text><rect x="55" y="385" width="1790" height="490" rx="22" fill="#eefbf4" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="420" font-family="Arial" font-size="18" font-weight="700" fill="#475569">APPLICATION / BUSINESS LAYER</text><rect x="55" y="850" width="1790" height="350" rx="22" fill="#fff7ed" stroke="#cbd5e1" stroke-width="2"/><text x="82" y="885" font-family="Arial" font-size="18" font-weight="700" fill="#475569">DATA &amp; DEVICE INTEGRATION LAYER</text><g filter="url(#shadow)"><rect x="690" y="185" width="520" height="145" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="1158" y="201" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M1165 197 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="950.0" y="227" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="950.0" y="263" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Touchscreen UI</text><text x="950.0" y="297" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Customer selects drink, size and confirms order</text><g filter="url(#shadow)"><rect x="690" y="490" width="520" height="175" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="1158" y="506" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M1165 502 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="950.0" y="532" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="950.0" y="568" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Order Manager</text><text x="950.0" y="602" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Validates order, calculates total and coordinates workflow</text><g filter="url(#shadow)"><rect x="150" y="600" width="440" height="165" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="538" y="616" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M545 612 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="370.0" y="642" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="370.0" y="678" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Payment Service</text><text x="370.0" y="712" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Credit-card authorization; tokenized payment data</text><g filter="url(#shadow)"><rect x="1310" y="600" width="440" height="165" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="1698" y="616" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M1705 612 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="1530.0" y="642" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="1530.0" y="678" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Receipt Service</text><text x="1530.0" y="712" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Formats order details and creates receipt job</text><g filter="url(#shadow)"><rect x="150" y="970" width="440" height="150" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="538" y="986" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M545 982 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="370.0" y="1012" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="370.0" y="1048" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Menu &amp; Pricing Repository</text><text x="370.0" y="1082" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Stores 3 drinks, 2 sizes and current prices</text><g filter="url(#shadow)"><rect x="1310" y="970" width="440" height="150" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="1698" y="986" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M1705 982 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="1530.0" y="1012" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="1530.0" y="1048" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Receipt Printer Adapter</text><text x="1530.0" y="1082" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">Device driver / USB or Ethernet printer interface</text><g filter="url(#shadow)"><rect x="690" y="970" width="520" height="150" rx="16" fill="#ffffff" stroke="#334155" stroke-width="3"/></g><rect x="1158" y="986" width="25" height="19" rx="2" fill="none" stroke="#334155" stroke-width="2"/><path d="M1165 982 h25 v19" fill="none" stroke="#334155" stroke-width="2"/><text x="950.0" y="1012" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">&lt;&lt;component&gt;&gt;</text><text x="950.0" y="1048" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">External Card Payment Gateway</text><text x="950.0" y="1082" text-anchor="middle" font-family="Arial" font-size="16" fill="#475569">External acquirer / processor; HTTPS + TLS</text><path d="M950 330 L950 490" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="743.5" y="391" width="413" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="950" y="412" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Order API: submit selections / order status</text><circle cx="950" cy="490" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M938 330 A12 12 0 0 1 962 330" fill="none" stroke="#b45309" stroke-width="4"/><path d="M690 565 L590 565 L590 682 L590 682" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="336.5" y="528" width="287" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="480" y="549" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Payment API: authorize amount</text><circle cx="590" cy="682" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M690 553 A12 12 0 0 0 690 577" fill="none" stroke="#b45309" stroke-width="4"/><path d="M1210 565 L1310 565 L1310 682" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="1306.5" y="528" width="287" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="1450" y="549" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Receipt API: generate receipt</text><circle cx="1310" cy="682" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M1210 553 A12 12 0 0 1 1210 577" fill="none" stroke="#b45309" stroke-width="4"/><path d="M790 665 L790 820 L370 820 L370 970" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="380.5" y="781" width="359" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="560" y="802" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Menu Query API: drinks, sizes, prices</text><circle cx="370" cy="970" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M778 665 A12 12 0 0 0 802 665" fill="none" stroke="#b45309" stroke-width="4"/><path d="M370 765 L370 900 L950 900 L950 970" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="685.0" y="921" width="530" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="950" y="942" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Gateway API: tokenized card authorization over HTTPS/TLS</text><circle cx="950" cy="970" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M358 765 A12 12 0 0 0 382 765" fill="none" stroke="#b45309" stroke-width="4"/><path d="M1530 765 L1530 970" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><rect x="1323.5" y="851" width="413" height="32" rx="7" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1"/><text x="1530" y="872" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" fill="#1e293b">Printer API: print receipt (USB / Ethernet)</text><circle cx="1530" cy="970" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><path d="M1518 765 A12 12 0 0 0 1542 765" fill="none" stroke="#b45309" stroke-width="4"/><rect x="75" y="1170" width="1750" height="105" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="125" cy="1215" r="11" fill="#ffffff" stroke="#0f766e" stroke-width="4"/><text x="150" y="1222" font-family="Arial" font-size="17" fill="#334155">Provided interface (lollipop)</text><path d="M490 1215 A12 12 0 0 0 514 1215" fill="none" stroke="#b45309" stroke-width="4"/><text x="530" y="1222" font-family="Arial" font-size="17" fill="#334155">Required interface (socket)</text><path d="M850 1215 L950 1215" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/><text x="970" y="1222" font-family="Arial" font-size="17" fill="#334155">Service dependency / data flow</text><text x="1400" y="1222" font-family="Arial" font-size="16" fill="#64748b">Payment is card-only; raw card data is not stored.</text></svg>